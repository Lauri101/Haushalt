<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushalt</title>
<meta name="theme-color" content="#0B0709">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>try{var d=document.documentElement;if(localStorage.getItem("haushalt-theme")==="light")d.setAttribute("data-app-theme","light");d.setAttribute("data-app-skin",localStorage.getItem("haushalt-skin")||"morgentau")}catch(e){document.documentElement.setAttribute("data-app-skin","morgentau")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --ink:#F5F5F7; --muted:#86868B; --line:rgba(255,255,255,.08);
  --accent:#0A84FF; --done:#30D158; --later:#FF9F0A; --danger:#FF453A;
  --field:rgba(255,255,255,.06); --card:rgba(255,255,255,.07);
  --edge-top:rgba(255,255,255,.16); --edge-bot:rgba(255,255,255,.04);
  --ease:cubic-bezier(.25,1,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  color:var(--ink);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000}}
:root[data-theme="dark"]{--bg:#000000}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}

/* ambient light: gives the glass something to refract */
.amb{position:fixed;inset:-20%;pointer-events:none;filter:blur(70px);z-index:0}
.amb i{position:absolute;border-radius:50%}
.amb .a{width:60%;height:38%;left:0;top:20%;background:radial-gradient(circle,rgba(var(--amb-a),.42),transparent 70%)}
.amb .b{width:55%;height:40%;right:0;top:46%;background:radial-gradient(circle,rgba(var(--amb-b),.32),transparent 70%)}
.amb .c{width:45%;height:28%;left:22%;bottom:6%;background:radial-gradient(circle,rgba(var(--amb-c),.18),transparent 70%)}

.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--edge-bot);border-top-color:var(--edge-top);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 25px 50px -12px rgba(0,0,0,.6);
}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none;border-radius:18px;padding:0 6px}
.app .top .count{flex:1;text-align:center}
.count{font-size:15px;color:var(--muted)}
.count b{color:var(--ink);font-weight:600}
.icon-btn{width:40px;height:40px;border:0;background:rgba(255,255,255,.06);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .3s var(--ease)}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn:focus-visible,.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{flex:1;position:relative;margin:18px 4px 12px;touch-action:none}
.card{
  position:absolute;inset:0;border-radius:32px;
  display:flex;align-items:center;justify-content:center;padding:36px 28px;
  user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;overflow:hidden;
}
.card.behind{transform:scale(.93) translateY(16px);opacity:.45;cursor:default;
  -webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.05);box-shadow:none}
.card .inner{display:flex;flex-direction:column;align-items:center;gap:24px;position:relative;z-index:1}
.card .ico{width:clamp(84px,24vw,104px);height:clamp(84px,24vw,104px);border-radius:28px;display:grid;place-items:center;
  font-size:clamp(46px,13vw,58px);line-height:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.card .text{font-size:clamp(30px,8.5vw,42px);line-height:1.1;font-weight:700;text-align:center;letter-spacing:-.025em;overflow-wrap:anywhere}
.card .tint{position:absolute;inset:0;opacity:0;pointer-events:none;border-radius:inherit}
.card .tint.r{background:radial-gradient(140% 110% at 100% 50%,rgba(48,209,88,.95),rgba(48,209,88,.45) 50%,rgba(48,209,88,.22) 100%)}
.card .tint.l{background:radial-gradient(140% 110% at 0% 50%,rgba(255,159,10,.95),rgba(255,159,10,.45) 50%,rgba(255,159,10,.22) 100%)}
.card .tint.d{background:radial-gradient(130% 100% at 50% 100%,rgba(10,132,255,.95),rgba(10,132,255,.45) 50%,rgba(10,132,255,.22) 100%)}
.card .stamp{position:absolute;z-index:2;top:26px;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  font-size:15px;font-weight:700;letter-spacing:.01em;color:#fff;opacity:0;pointer-events:none;transform:scale(.85);
  border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card .stamp.r{left:22px;transform-origin:left center}
.card .stamp.l{right:22px;transform-origin:right center}
.card .stamp.d{left:50%;margin-left:-52px;width:104px;justify-content:center}
.card.behind.promote{transform:none;opacity:1;transition:transform .32s var(--ease),opacity .32s var(--ease)}
.card.behind.enter{animation:enterB .5s var(--ease) backwards}
@keyframes enterB{from{opacity:0;transform:scale(.86) translateY(34px)}to{opacity:.45;transform:scale(.93) translateY(16px)}}
.card.reappear{animation:reap .5s var(--ease) backwards}
@keyframes reap{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.card .lastdone{font-size:14px;color:var(--muted);margin-top:-8px;text-align:center}
.card .overdue{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;font-weight:500;color:#FF453A;z-index:1;letter-spacing:-.005em}
.card.fly{transition:transform .32s var(--ease),opacity .32s var(--ease)}
.card.back{transition:transform .45s var(--ease)}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.empty h2{margin:0;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.025em}
.empty p{margin:0;color:var(--muted);font-size:16px;max-width:30ch;line-height:1.45}
.donelist{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left}
.empty.withcount{overflow-y:auto;justify-content:flex-start;padding-top:12px;padding-bottom:24px}
.empty.withcount > :first-child{margin-top:auto}
.empty.withcount > :last-child{margin-bottom:auto}
.streakban{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);height:52px;z-index:6;pointer-events:none;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(20,8,2,.92);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:1px solid rgba(255,159,10,.35);border-top-color:rgba(255,214,10,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px rgba(255,69,58,.15),0 0 34px rgba(255,110,10,.6),0 14px 30px -10px rgba(0,0,0,.7);
  transform:translateX(-100vw);visibility:hidden;max-width:488px;margin-left:auto;margin-right:auto}
.flames{position:absolute;inset:0;filter:blur(8px) saturate(140%)}
.flames i{position:absolute;bottom:-40%;width:42%;height:120%;border-radius:50% 50% 45% 45%;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 85%,rgba(255,214,10,.95),rgba(255,120,10,.85) 35%,rgba(255,45,30,.55) 60%,transparent 75%);
  animation:flick 1.6s ease-in-out infinite alternate}
.flames i:nth-child(1){left:-10%;animation-duration:1.7s}
.flames i:nth-child(2){left:12%;height:135%;animation-duration:1.3s;animation-delay:-.4s}
.flames i:nth-child(3){left:32%;height:150%;animation-duration:1.9s;animation-delay:-.9s}
.flames i:nth-child(4){left:52%;height:130%;animation-duration:1.4s;animation-delay:-.2s}
.flames i:nth-child(5){left:70%;height:142%;animation-duration:1.8s;animation-delay:-1.1s}
.flames i:nth-child(6){left:24%;width:30%;height:90%;animation-duration:1.1s;animation-delay:-.6s;background:radial-gradient(ellipse at 50% 85%,rgba(255,255,220,.9),rgba(255,214,10,.7) 40%,transparent 70%)}
.flames i:nth-child(7){left:56%;width:30%;height:95%;animation-duration:1.2s;animation-delay:-.3s;background:radial-gradient(ellipse at 50% 85%,rgba(255,255,220,.9),rgba(255,214,10,.7) 40%,transparent 70%)}
@keyframes flick{0%{transform:translateY(6%) scaleX(1) scaleY(.92);opacity:.85}50%{transform:translateY(-4%) scaleX(.9) scaleY(1.06);opacity:1}100%{transform:translateY(2%) scaleX(1.06) scaleY(.98);opacity:.9}}
.sbtext{position:absolute;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;color:#fff}
.sbnum{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,214,10,.9),0 0 26px rgba(255,90,10,.8),0 1px 0 rgba(120,30,0,.6)}
.sblbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 8px rgba(80,20,0,.9)}
.streakban.go{visibility:visible;animation:sbRun 5.2s cubic-bezier(.25,1,.5,1) forwards}
@keyframes sbRun{0%{transform:translateX(-100vw)}11%{transform:translateX(0)}89%{transform:translateX(0)}100%{transform:translateX(100vw)}}
.sk{position:relative;display:inline-block;isolation:isolate;margin-left:2px;vertical-align:-1px}
.sk::before{content:"";position:absolute;left:-7px;right:-7px;bottom:-2px;height:150%;z-index:-1;border-radius:50% 50% 40% 40%;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,120,10,.75),rgba(255,45,30,.35) 45%,transparent 70%);
  filter:blur(5px);opacity:calc(.35 + .65 * var(--heat,0));animation:skFlame 1.25s ease-in-out infinite alternate}
.skn{display:inline-block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(0deg,#FF2D1A 0%,#FF6A00 28%,#FFA800 52%,#FFE14D 74%,#FFF8D6 100%);background-size:100% 240%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:skRise 1.6s ease-in-out infinite alternate,skGlow 1.1s ease-in-out infinite alternate}
.emb{position:absolute;left:0;right:0;bottom:62%;height:0;pointer-events:none}
.emb i{position:absolute;bottom:0;width:calc(2px * var(--s,1));height:calc(2px * var(--s,1));margin-left:-1px;border-radius:50%;opacity:0;
  background:#FFF3C4;box-shadow:0 0 2px 1px rgba(255,190,40,.95),0 0 5px 1px rgba(255,100,10,.7);
  animation:ember 1.5s cubic-bezier(.2,.7,.4,1) infinite}
@keyframes ember{
  0%{transform:translate(0,2px) scale(1);opacity:0}
  8%{opacity:1}
  45%{transform:translate(calc(var(--dx)*.55),calc(-9px - 5px * var(--heat,0))) scale(.9);opacity:1}
  70%{opacity:.55}
  80%{opacity:.9}
  100%{transform:translate(var(--dx),calc(-18px - 10px * var(--heat,0))) scale(.4);opacity:0}}
@keyframes skRise{0%{background-position:0% 100%}100%{background-position:0% 0%}}
@keyframes skGlow{0%{filter:drop-shadow(0 0 2px rgba(255,170,0,.7)) drop-shadow(0 -1px 5px rgba(255,80,10,.5))}100%{filter:drop-shadow(0 0 4px rgba(255,210,60,.95)) drop-shadow(0 -2px 9px rgba(255,90,10,.8))}}
@keyframes skFlame{0%{transform:translateY(8%) scaleY(.85) scaleX(1.05)}50%{transform:translateY(-6%) scaleY(1.1) scaleX(.92)}100%{transform:translateY(2%) scaleY(.95) scaleX(1)}}
.streakline{font-size:15px;color:#FF9F0A;font-weight:600;margin:-4px 0 6px}
.calday.sd{background:rgba(255,159,10,.14)}
.calday.sd.cl{border-top-left-radius:0;border-bottom-left-radius:0;box-shadow:-4px 0 0 rgba(255,159,10,.14)}
.calday.sd.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.dviews{position:absolute;inset:0;overflow:hidden}
.dtrack{position:absolute;inset:0;will-change:transform}
.dpage{position:absolute;left:0;right:0;top:0;height:100%}
.dpage.p1{top:100%;display:flex;flex-direction:column;padding:4px 4px 0}
.dpager{position:absolute;right:0;bottom:14px;display:flex;flex-direction:column;z-index:4}
.dpager button{width:26px;height:16px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.dpager button i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);transition:background .4s,transform .4s}
.dpage.p2{top:200%;display:flex;flex-direction:column;align-items:center;padding:4px 0 0}
.ach-h{text-align:center;padding:0 20px;flex:none}
.ach-season{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#FFB21A;margin-bottom:8px}
.ach-h h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.ach-h p{margin:6px auto 0;font-size:14px;color:var(--muted);max-width:32ch;line-height:1.4}
.ach-tag{display:inline-block;margin-top:10px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;
  color:#2a1a00;background:linear-gradient(180deg,#FFD54A,#FFA800);padding:7px 12px;border-radius:6px}
.ach-tag.part{background:rgba(255,255,255,.08);color:var(--muted)}
.ach-stage{flex:1;min-height:0;width:100%;position:relative}
.ach-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ach-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:30px;margin:0}
.ach-prog{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;font:500 13px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.05em;margin:2px 0 8px}
.ach-prog i{display:block;width:96px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.ach-prog i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--ink)}
.ach-nav{flex:none;display:flex;justify-content:center;padding:0 26px 8px}
.ach-nav button{width:36px;height:40px;border:0;background:none;padding:0;color:rgba(255,255,255,.3);display:grid;place-items:center;position:relative;cursor:pointer}
.ach-nav button.got{color:var(--ink)}
.ach-nav button[aria-current="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:3px;height:3px;border-radius:2px;background:#FFB21A}
.ach-nav button:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.dpager button[aria-current="true"] i{background:#fff;transform:scale(1.15)}
.dpager button:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.ygrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:26px repeat(31,minmax(0,1fr))}
.ym{text-align:center;font:500 13px/26px ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted)}
.ym.now{color:#fff}
.yd{border:0;background:none;padding:0;display:grid;place-items:center;cursor:default;min-height:0}
.yd i{display:block;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.26)}
.yd.today i{width:5px;height:5px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.yd.has{cursor:pointer;filter:drop-shadow(0 0 3px rgba(255,180,30,.5))}
.yd.has i{width:9px;height:calc(8px + var(--h,1) * 1.5px);border-radius:0;box-shadow:none;
  background:linear-gradient(90deg,#FFEA8A 0 50%,#E39E07 50% 100%);clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:50% 100%}
.yd.sel{filter:drop-shadow(0 0 7px rgba(255,210,80,.95))}
.yd.sel i{background:linear-gradient(90deg,#fff 0 50%,#FFC93C 50% 100%)}
.yd.has:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.p1.on .yd.has i{animation:cone .55s cubic-bezier(.25,1.5,.5,1) both;animation-delay:var(--dl,0s)}
@keyframes cone{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.yfoot{flex:none;height:66px;display:flex;align-items:center;justify-content:center;gap:18px;padding-right:20px}
.yyear{display:flex;flex-direction:column;align-items:center;line-height:1}
.yyear b{font-family:"Bebas Neue","Oswald","Impact","Arial Narrow",sans-serif;font-weight:400;font-size:44px;letter-spacing:.02em;color:#fff}
.yyear span{font-size:11px;color:var(--muted);margin-top:2px}
.yarr{border:0;background:none;color:rgba(255,255,255,.35);font-size:26px;width:36px;height:44px;cursor:pointer}
.yarr:hover{color:#fff}
.ypop{position:absolute;left:10px;right:10px;bottom:74px;border-radius:22px;padding:14px 16px 12px;z-index:3;animation:popIn .4s cubic-bezier(.25,1,.5,1);
  display:flex;flex-direction:column;max-height:calc(100vh / 3);max-height:calc(100dvh / 3)}
@keyframes popIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ypop-h{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:8px}
.ypop-x{border:0;background:rgba(255,255,255,.08);color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}
.ypop-h{flex:none}
.ypop ul{list-style:none;margin:0;padding:0 0 2px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.ypop ul.more{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.ypop ul.more.end{-webkit-mask-image:none;mask-image:none}
.ypop li{flex:none}
.ypop li{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(245,245,247,.85)}
.done3d{gap:0}
.n3d{--fs:clamp(190px,58vw,260px);font-size:calc(var(--fs) * var(--k,1));perspective:900px;touch-action:none;cursor:pointer;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none;flex:none;
  transition:font-size .65s cubic-bezier(.25,1,.5,1);padding:.04em .2em 0}
.done3d.open .n3d{font-size:calc(var(--fs) * var(--k,1) * .52)}
.n3d:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:12px}
.n3d-float{transform-style:preserve-3d;animation:n3dFloat 7s ease-in-out infinite}
.n3d-rot{position:relative;transform-style:preserve-3d;display:grid;will-change:transform}
.n3d.held .n3d-glow{opacity:.85}
.n3d.held .n3d-float{animation-play-state:paused}
.n3d-l,.n3d-glow{grid-area:1/1;display:block;font-family:"Bebas Neue","Oswald","Impact","Arial Narrow",sans-serif;font-weight:400;
  line-height:.82;letter-spacing:.02em;font-variant-numeric:tabular-nums;backface-visibility:visible;
  background:linear-gradient(0deg,#F7C548 0%,#E9731A 26%,#7A2A08 46%,#0B3B9C 62%,#0A84FF 80%,#5DE0E6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.n3d-l.f{background:linear-gradient(170deg,#2a2a31 0%,#09090b 35%,#000 100%);-webkit-background-clip:text;background-clip:text}
.n3d-l.b{filter:brightness(.55)}
.n3d-glow{filter:blur(26px);opacity:.55}
@keyframes n3dFloat{0%,100%{transform:rotateY(-5deg) rotateX(2deg) translateY(0)}50%{transform:rotateY(5deg) rotateX(-2deg) translateY(-6px)}}
.n3d-lbl{font-size:15px;color:var(--muted);margin:14px 0 0;letter-spacing:.01em}
.done3d .donelist{max-height:0;overflow:hidden;margin-top:0;transition:max-height .65s cubic-bezier(.25,1,.5,1),margin-top .65s cubic-bezier(.25,1,.5,1)}
.done3d .donelist li{animation:none;opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .5s cubic-bezier(.25,1,.5,1)}
.done3d.open .donelist{max-height:calc(var(--rows) * 32px + 20px);margin-top:26px}
.done3d.open .donelist li{opacity:1;transform:none;transition-delay:var(--d,0s)}
.donecount{position:relative;width:132px;height:132px;flex:none;margin-bottom:10px;animation:dcIn .7s var(--ease) both}
.donecount .ring,.donecount .glow{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#30D158,#64D2FF,#0A84FF,#BF5AF2,#30D158)}
.donecount .ring{-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:dcSpin 3.2s linear infinite}
.donecount .glow{filter:blur(18px);animation:dcSpin 3.2s linear infinite,dcPulse 2.2s ease-in-out infinite}
.donecount .core{position:absolute;inset:9px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.12),rgba(255,255,255,.03) 70%),#05060a;
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.donecount b{color:#FFFFFF;font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcPulse{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes dcIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.donelist li{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--ink);opacity:0;animation:dl .5s var(--ease) forwards}
.donelist li span{opacity:.8}
.donelist svg{flex:none}
@keyframes dl{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hint{flex:none;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 10px 14px;height:32px}
.hint .l{color:var(--later)} .hint .r{color:var(--done)} .hint .d{color:var(--accent)}
.undo{position:fixed;z-index:5;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140px);
  color:var(--ink);border-radius:999px;padding:12px 22px;font-size:15px;font-weight:500;cursor:pointer;transition:transform .45s var(--ease)}
.undo.show{transform:translateX(-50%) translateY(0)}

/* success */
.success{position:fixed;inset:0;z-index:4;pointer-events:none;display:grid;place-items:center}
.success .disc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 35%,rgba(48,209,88,.35),rgba(48,209,88,.12));
  border:1px solid rgba(48,209,88,.45);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 60px rgba(48,209,88,.35);opacity:0;transform:scale(.6)}
.success .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(48,209,88,.6);opacity:0}
.success path{stroke-dasharray:48;stroke-dashoffset:48}
.success.go .disc{animation:pop .9s var(--ease) forwards}
.success.go .ring{animation:ring .9s var(--ease) .08s forwards}
.success.go path{animation:draw .38s var(--ease) .14s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}22%{opacity:1;transform:scale(1.04)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes draw{to{stroke-dashoffset:0}}

.btn{border:0;border-radius:16px;height:52px;padding:0 20px;font-size:16px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on-accent,#fff);box-shadow:0 10px 30px -10px rgba(var(--accent-rgb,10,132,255),.7);transition:transform .3s var(--ease),filter .3s var(--ease)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));color:var(--ink);box-shadow:none;border:1px solid var(--edge-bot);border-top-color:var(--edge-top)}
.btn.danger{background:rgba(255,69,58,.12);color:var(--danger);box-shadow:none;border:1px solid rgba(255,69,58,.25)}

/* settings */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
.sheet-inner{position:relative;z-index:1;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;padding:0 16px}
.sheet .top{padding:0 2px;border-radius:0}
.sheet h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.025em}
.list{flex:1;overflow-y:auto;padding:6px 0 16px}
.group{border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:none;border:0;width:100%;text-align:left;transition:background .3s var(--ease)}
.row + .row{border-top:1px solid var(--line)}
.row:hover{background:rgba(255,255,255,.05)}
.row .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:19px;flex:none}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tt{font-size:16px;font-weight:600;letter-spacing:-.01em}
.row .ld{font-size:13px;color:var(--muted)}
.row .m{font-size:13px;color:var(--muted);white-space:nowrap}
.calwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 0 calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.calwrap > *{flex-shrink:0}
.list,.form{min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cal{border-radius:24px;padding:12px 10px 14px;touch-action:pan-y;position:relative;user-select:none;-webkit-user-select:none}
.calhead .icon-btn{width:44px;height:44px;background:rgba(255,255,255,.08)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.caltitle{text-align:center;display:flex;flex-direction:column;gap:2px}
.caltitle b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.caltitle span{font-size:12px;color:var(--muted)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0 6px;font-weight:500}
.calday{aspect-ratio:1/1.05;border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);transition:background .3s var(--ease);padding:0}
.calday:hover:not(:disabled){background:rgba(255,255,255,.06)}
.calday:disabled{color:rgba(245,245,247,.25);cursor:default}
.calday .n{font-size:15px;line-height:1}
.calday.today .n{color:var(--accent);font-weight:700}
.calday.sel{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.calday .dot{min-width:6px;height:6px;border-radius:3px;background:var(--done);font-size:0;line-height:0}
.calday.has .dot:not(:empty){height:14px;min-width:14px;border-radius:7px;font-size:9px;line-height:14px;font-weight:700;color:#04210f;padding:0 3px}
.calday .dot.empty{background:transparent}
.calday:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.calsel{font-size:15px;font-weight:600;margin:4px 6px 0}
.calnone{color:var(--muted);font-size:15px;margin:0 6px}
.row.static{cursor:default}
.row.static:hover{background:none}
.list .none{color:var(--muted);padding:24px 4px;font-size:16px}
.foot{flex:none;padding:12px 0 16px}
.foot .btn{width:100%}
.full{width:100%}
.linkbtn{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:8px}
textarea{width:100%;font:inherit;font-size:13px;padding:12px 14px;border-radius:16px;border:1px solid var(--edge-bot);border-top-color:var(--edge-top);background:var(--field);color:var(--ink);resize:vertical;font-family:ui-monospace,Menlo,monospace}

.form{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:8px 0 16px}
label.lbl{font-size:13px;color:var(--muted);display:block;margin:0 4px 8px}
input[type=text],input[type=number],input[type=date],select{width:100%;font:inherit;font-size:17px;height:52px;padding:0 16px;border-radius:16px;
  border:1px solid var(--edge-bot);border-top-color:var(--edge-top);background:var(--field);color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;line-height:52px}
.seg{display:flex;background:var(--field);border:1px solid var(--edge-bot);border-top-color:var(--edge-top);border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;height:40px;border-radius:12px;font-size:14px;cursor:pointer;color:var(--muted);transition:background .3s var(--ease),color .3s var(--ease)}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.14);color:var(--ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.every{display:flex;align-items:center;gap:12px;font-size:17px}
.every input{width:90px;text-align:center}
.chips{display:flex;gap:4px;justify-content:space-between}
.chip{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:13px;color:var(--muted);transition:all .3s var(--ease)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent;font-weight:600}
.daysbox{display:flex;flex-direction:column;gap:16px}
.posrow{display:flex;align-items:center;gap:10px;font-size:17px}
.posrow select{width:auto;flex:none}
.icofield{display:flex;gap:12px;align-items:center}
.icofield input{width:72px;text-align:center;font-size:28px;padding:0 6px;flex:none}
.icofield span{font-size:13px;color:var(--muted);line-height:1.4}
.form-actions{display:flex;gap:10px;flex:none;padding:12px 0 16px}
.form-actions .btn{flex:1}
.err{color:var(--danger);font-size:14px;min-height:18px;margin-top:6px}
@media (prefers-reduced-motion:reduce){
  .card.fly,.card.back,.undo,.btn,.row,.chip,.card.behind.promote{transition:none}
  .card.behind.enter,.card.reappear{animation:none}
  .donelist li{animation:none;opacity:1}
  .donecount,.donecount .ring{animation:none}
  .streakban.go{animation:sbFade 4s linear forwards}
  .flames i{animation:none}
  .skn,.sk::before{animation:none}
  .emb{display:none}
  .n3d-float{animation:none}
  .p1.on .yd.has i,.ypop{animation:none}
  .n3d,.done3d .donelist,.done3d .donelist li{transition:none}
  .skn{filter:drop-shadow(0 0 3px rgba(255,170,0,.8))}
  @keyframes sbFade{0%{transform:none;opacity:0}10%,85%{transform:none;opacity:1}100%{transform:none;opacity:0}}
  .donecount .glow{animation:none;opacity:.5}
  .success.go .disc{animation:fade .6s linear forwards} .success.go .ring{animation:none} .success path{stroke-dashoffset:0}
  @keyframes fade{0%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}
}

/* ---------- light mode ---------- */
.themefade{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .23s cubic-bezier(.4,0,.2,1)}
.themefade.in{opacity:1}
.themefade:not(.in){transition-duration:.42s}
::view-transition-old(root),::view-transition-new(root){animation-duration:.55s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
html,body{transition:background-color .4s ease}
.switch{-webkit-appearance:none;appearance:none;flex:none;width:51px;height:31px;border-radius:16px;margin:0;position:relative;cursor:pointer;
  background:rgba(120,120,128,.36);transition:background .3s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--ease)}
.switch:checked{background:var(--done)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.setrow{cursor:pointer}
:root[data-app-theme="light"]{
  --bg:#F2F2F7; --ink:#1D1D1F; --muted:#6E6E73; --line:rgba(0,0,0,.08);
  --field:rgba(0,0,0,.04); --card:rgba(255,255,255,.7);
  --edge-top:rgba(255,255,255,.95); --edge-bot:rgba(0,0,0,.07); color-scheme:light}
[data-app-theme="light"] .amb .a{background:radial-gradient(circle,rgba(var(--amb-a),.26),transparent 70%)}
[data-app-theme="light"] .amb .b{background:radial-gradient(circle,rgba(var(--amb-b),.18),transparent 70%)}
[data-app-theme="light"] .amb .c{background:radial-gradient(circle,rgba(var(--amb-c),.16),transparent 70%)}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 40px -14px rgba(30,40,70,.2)}
[data-app-theme="light"] .icon-btn{background:rgba(0,0,0,.05)}
[data-app-theme="light"] .icon-btn:hover{background:rgba(0,0,0,.09)}
[data-app-theme="light"] .card.behind{background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.05)}
[data-app-theme="light"] .card .ico{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.06)}
[data-app-theme="light"] .btn.ghost{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.08)}
[data-app-theme="light"] input[type=text],[data-app-theme="light"] input[type=number],[data-app-theme="light"] input[type=date],
[data-app-theme="light"] select,[data-app-theme="light"] textarea,[data-app-theme="light"] .seg{border-color:rgba(0,0,0,.1);background:rgba(255,255,255,.75)}
[data-app-theme="light"] .seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
[data-app-theme="light"] .chip{background:rgba(255,255,255,.75)}
[data-app-theme="light"] .row:hover{background:rgba(0,0,0,.03)}
[data-app-theme="light"] .row.static:hover{background:none}
[data-app-theme="light"] .row .ri{background:rgba(0,0,0,.05)}
[data-app-theme="light"] .ypop-x{background:rgba(0,0,0,.06)}
[data-app-theme="light"] .yd i{background:rgba(0,0,0,.2)}
[data-app-theme="light"] .yd.today i{background:#1D1D1F;box-shadow:0 0 0 3px rgba(0,0,0,.08)}

[data-app-theme="light"] .yarr:hover{color:#1D1D1F}
[data-app-theme="light"] .dpager button i{background:rgba(0,0,0,.18)}
[data-app-theme="light"] .ach-tag.part{background:rgba(0,0,0,.06)}
[data-app-theme="light"] .ach-prog i{background:rgba(0,0,0,.12)}
[data-app-theme="light"] .ach-nav button{color:rgba(0,0,0,.25)}

[data-app-theme="light"] .n3d-glow{opacity:.28}

[data-app-theme="light"] .undo{color:var(--ink)}
[data-app-theme="light"] .sheet{background:var(--bg)}

.setlist{display:flex;flex-direction:column;gap:10px}
.setlbl{font-size:13px;color:var(--muted);margin:8px 6px 0}
.skins{border-radius:22px;padding:14px 8px 12px;display:flex;justify-content:space-between;gap:4px}
.skin{flex:1;min-width:0;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
.skin-dot{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px transparent,inset 0 1px 0 rgba(255,255,255,.15);transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.skin[aria-checked="true"] .skin-dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);transform:scale(1.04)}
.skin[aria-checked="true"]{color:var(--ink);font-weight:600}
.skin-n{font-size:10.5px;line-height:1.2;text-align:center;letter-spacing:-.01em;-webkit-hyphens:auto;hyphens:auto;max-width:100%}
.skin:focus-visible{outline:2px solid var(--accent);border-radius:12px}
.volrow{gap:12px}
.volrow.off{opacity:.45}
.vol{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0;--v:40%}
.vol::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--v),rgba(128,128,128,.3) var(--v))}
.vol::-moz-range-track{height:4px;border-radius:2px;background:rgba(128,128,128,.3)}
.vol::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.vol::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.vol:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.volv{min-width:40px;text-align:right}

.bk{gap:12px}
.bk-stat,.bk-prev{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.bk-stat b,.bk-prev b{font-size:16px}
.bk-stat span,.bk-prev span{font-size:13px;color:var(--muted);line-height:1.4}
.bk-stat.due b{color:var(--later)}
.bk-hint{margin:-4px 4px 6px;font-size:12.5px;color:var(--muted);line-height:1.4}
.bk-msg{margin:0 4px;font-size:13.5px;min-height:18px;color:var(--ink)}
.bk-prev .form-actions{padding:8px 0 0}
.bk-more{margin-top:6px}
.bk-more summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:8px 4px}
.bk-text{display:flex;flex-direction:column;gap:8px}
.row .ld.warn{color:var(--later)}
.icon-btn{position:relative}
.icon-btn.badge::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--later);box-shadow:0 0 0 2px var(--bg)}
</style>
</head>
<body>
<div class="amb" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<div class="app">
  <div class="top glass">
    <button class="icon-btn" id="openSettings" aria-label="Aufgaben verwalten">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <span class="count" id="count"></span>
    <button class="icon-btn" id="openPrefs" aria-label="Einstellungen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="hint" id="hint"><span class="l">← Morgen</span><span class="d">↓ Später</span><span class="r">Erledigt →</span></div>
</div>
<button class="undo glass" id="undo">Rückgängig</button>
<canvas id="confetti" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3"></canvas>
<div class="streakban" id="streakban" aria-hidden="true"><div class="flames"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="sbtext"><span class="sbnum" id="sbnum">1</span><span class="sblbl" id="sblbl">Tag in Folge</span></div></div>
<div class="success" id="success" aria-hidden="true"><div class="disc"><span class="ring"></span><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>
<div class="live" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Aufgaben">
  <div class="amb" aria-hidden="true" style="position:absolute"><i class="a"></i><i class="b"></i><i class="c"></i></div>
  <div class="sheet-inner" id="sheetInner"></div>
</div>

<script>
(function(){
  const LS_KEY = "haushalt-routine-v1";
  const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"]; // index 0 = Monday
  let state = { tasks: [] };
  let dbRef = null;
  let writing = Promise.resolve();
  let lastAction = null, undoTimer = null;

  /* ---------- dates (local) ---------- */
  const pad = n => String(n).padStart(2,"0");
  const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  const today = () => ymd(new Date());
  const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
  const wd = s => (parse(s).getDay()+6)%7; // Mon=0
  function nextWeekday(fromStr, days, inclusive){
    if(!days.length) return addDays(fromStr,1);
    for(let i = inclusive?0:1; i<=7; i++){ const c=addDays(fromStr,i); if(days.includes(wd(c))) return c; }
    return addDays(fromStr,7);
  }
  /* weekly / monthly schedules for "days" mode */
  const REPEATS = [["w1","Jede Woche"],["w2","Alle 2 Wochen"],["w3","Alle 3 Wochen"],["m1","Monatlich"],["m3","Alle 3 Monate"],["m6","Alle 6 Monate"]];
  const POS = [[1,"ersten"],[2,"zweiten"],[3,"dritten"],[4,"vierten"],[-1,"letzten"]];
  const rep = t => t.repeat || "w1";
  const isMonthly = t => rep(t)[0]==="m";
  const repN = t => parseInt(rep(t).slice(1),10);
  const mod = (a,n) => ((a%n)+n)%n;
  const weekIdx = s => Math.floor((Date.UTC(...s.split("-").map((v,i)=>i===1?v-1:+v)) / 864e5 - wd(s)) / 7);
  const monthIdx = s => { const [y,m]=s.split("-").map(Number); return y*12+m; };
  function posMatch(s, pos){
    const d=parse(s), day=d.getDate();
    if(pos===-1){ const dim=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return day+7>dim; }
    return Math.ceil(day/7)===pos;
  }
  function isOcc(s, t, ignoreAnchor){
    if(!t.days.includes(wd(s))) return false;
    const n = repN(t), a = (!ignoreAnchor && t.anchor) ? t.anchor : null;
    if(isMonthly(t)){
      if(!posMatch(s, t.mpos||1)) return false;
      return !a || mod(monthIdx(s)-monthIdx(a), n)===0;
    }
    return !a || mod(weekIdx(s)-weekIdx(a), n)===0;
  }
  function nextOcc(fromStr, t, inclusive, ignoreAnchor){
    if(!t.days.length) return addDays(fromStr,1);
    for(let i=inclusive?0:1; i<=400; i++){ const c=addDays(fromStr,i); if(isOcc(c,t,ignoreAnchor)) return c; }
    return addDays(fromStr,7);
  }
  function setAnchor(t){ t.anchor = nextOcc(today(), t, true, true); }
  function firstDue(t){ if(t.mode==="once") return t.date; return t.mode==="days" ? nextOcc(today(), t, true) : today(); }
  function afterDone(t){ return t.mode==="days" ? nextOcc(today(), t, false) : addDays(today(), Math.max(1,t.every)); }
  function rhythmLabel(t){
    if(t.mode==="once"){ const d=parse(t.date); return "einmalig, "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"."; }
    if(t.mode==="days"){
      const r = rep(t), dn = [...t.days].sort().map(i=>DAYS[i]).join(", ");
      if(r[0]==="m"){ const pl = (POS.find(p=>p[0]===(t.mpos||1))||POS[0])[1]; const lead = r==="m1"?"monatlich":"alle "+repN(t)+" Monate"; return lead+", "+pl+" "+dn; }
      if(r==="w1") return t.days.length===7 ? "täglich" : dn;
      return "alle "+repN(t)+" Wochen, "+dn;
    }
    return t.every===1 ? "täglich" : "alle "+t.every+" Tage";
  }

  /* ---------- icons ---------- */
  const ICONS = [
    [["blume","pflanze","gieß","giess","balkon","garten","rasen","unkraut"],"🪴"],
    [["wäsche","waesche","waschmaschine","trockner","bügel","buegel","socken","kleidung"],"🧺"],
    [["bett","bettwäsche","bezug","laken","matratze"],"🛏️"],
    [["müll","muell","abfall","tonne","gelber sack","papiermüll","altglas","pfand"],"🗑️"],
    [["staubsaug","saugen","saugroboter"],"🧹"],
    [["wisch","boden","fegen","kehren","besen"],"🧹"],
    [["staub"],"🪶"],
    [["spül","spuel","geschirr","abwasch"],"🍽️"],
    [["kühlschrank","kuehlschrank","gefrier","tiefkühl"],"🧊"],
    [["einkauf","einkaufen","supermarkt","lebensmittel","besorgen"],"🛒"],
    [["koch","essen","meal","vorrat","rezept"],"🍳"],
    [["bad","dusche","badewanne","toilette","klo","wc","waschbecken","fliesen"],"🛁"],
    [["fenster","spiegel","glas"],"🪟"],
    [["küche","kueche","herd","ofen","backofen","mikrowelle","arbeitsplatte"],"🔥"],
    [["entkalk","kaffee","espresso","wasserkocher"],"☕"],
    [["filter","dunstabzug","lüftung","lueftung","heizung","heizkörper"],"🌬️"],
    [["lüften","lueften","luft"],"🌬️"],
    [["katze","hund","haustier","futter","katzenklo","napf"],"🐾"],
    [["post","briefkasten","brief","paket"],"📬"],
    [["rechnung","überweis","ueberweis","miete","steuer","konto","bezahl"],"💶"],
    [["auto","tanken","reifen","waschanlage"],"🚗"],
    [["fahrrad","rad "],"🚲"],
    [["arzt","termin","rezept apotheke","apotheke"],"🩺"],
    [["geburtstag","geschenk"],"🎁"],
    [["batterie","rauchmelder","glühbirne","lampe"],"🔋"],
    [["handtuch","handtücher"],"🧻"],
    [["sport","training","laufen","gym"],"🏃"],
    [["aufräum","aufraeum","ordnung","sortier","ausmisten"],"📦"],
    [["anruf","anrufen","telefon","mama","papa"],"📞"]
  ];
  function keywordIcon(text){
    const t=" "+text.toLowerCase()+" ";
    for(const [keys,ic] of ICONS){ if(keys.some(k=>t.includes(k))) return ic; }
    return null;
  }
  const iconOf = t => t.icon || keywordIcon(t.text) || "🏠";
  let samplePromise = null;
  function getSample(){
    if(!samplePromise) samplePromise = (window.claude && window.claude.use) ? claude.use("sample").catch(()=>null) : Promise.resolve(null);
    return samplePromise;
  }
  const validIcon = e => typeof e==="string" && e.trim().length>0 && [...e.trim()].length<=4 && !/[A-Za-z0-9]/.test(e);
  async function aiIcon(id){
    try{
      const sample = await getSample(); if(!sample) return;
      const t0 = state.tasks.find(x=>x.id===id); if(!t0) return;
      const res = await sample.json('Wähle genau ein Emoji, das die folgende Haushaltsaufgabe bildlich am besten darstellt. Antworte nur mit JSON im Format {"emoji":"…"}. Aufgabe: '+JSON.stringify(t0.text), {modelTier:"quick"});
      const t = state.tasks.find(x=>x.id===id);
      if(t && !t.iconManual && res && validIcon(res.emoji)){ t.icon = res.emoji.trim(); save(); render(); }
    }catch(e){}
  }

  /* ---------- storage ---------- */
  const LOG_DAYS = 400;
  function norm(){
    if(!Array.isArray(state.log)) state.log = [];
    if(!state.days || typeof state.days!=="object") state.days = {};
    if(typeof state.best!=="number") state.best = 0;
    if(!state.logSeeded){
      state.tasks.forEach(t=>{ if(t.last && !state.log.some(e=>e.d===t.last && e.id===t.id)) state.log.push({d:t.last, id:t.id, t:t.text, i:iconOf(t)}); });
      state.log.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
      state.logSeeded = true;
    }
    const cut = addDays(today(), -LOG_DAYS);
    if(state.log.length && state.log[0].d < cut) state.log = state.log.filter(e=>e.d>=cut);
  }
  function loadLocal(){
    try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw); if(s&&Array.isArray(s.tasks)) state=s; } }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    if(dbRef){
      const snapshot = JSON.parse(JSON.stringify(state));
      writing = writing.then(()=>dbRef.set(snapshot)).catch(()=>{});
    }
  }
  async function connectDb(){
    try{
      if(!window.claude || !window.claude.use) return;
      const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if(!db || !user) return;
      const uid = await user.id();
      if(!uid) return;
      const ref = db.doc("data/users/"+uid+"/routine");
      const snap = await ref.get();
      if(snap.exists){
        const d = snap.data();
        if(d && Array.isArray(d.tasks)){ state = JSON.parse(JSON.stringify(d)); try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} }
        dbRef = ref;
        norm(); cleanup(); render();
      } else {
        dbRef = ref;
        if(state.tasks.length) save();
      }
      document.addEventListener("visibilitychange", async ()=>{
        if(document.visibilityState!=="visible" || !dbRef) return;
        try{ await writing; const s=await dbRef.get(); if(s.exists){ const d=s.data(); if(d&&Array.isArray(d.tasks)){ state=JSON.parse(JSON.stringify(d)); norm(); render(); } } }catch(e){}
      });
    }catch(e){}
  }

  /* ---------- deck ---------- */
  const stage = document.getElementById("stage");
  const countEl = document.getElementById("count");
  const hint = document.getElementById("hint");
  function active(){ return state.tasks.filter(x=>!x.done); }
  function overdueDays(t){
    const base = t.since || t.next; if(!base) return 0;
    return Math.max(0, Math.round((parse(today()) - parse(base)) / 864e5));
  }
  function lastDoneLabel(t){
    if(!t.last) return "noch nie erledigt";
    const n = Math.max(0, Math.round((parse(today()) - parse(t.last)) / 864e5)), d = parse(t.last);
    const rel = n===0 ? "heute" : n===1 ? "gestern" : "vor "+n+" Tagen";
    return "zuletzt "+rel+" · "+d.getDate()+"."+(d.getMonth()+1)+".";
  }
  function dueTasks(){ const t=today(); const key=x=>(x.qd===t && x.q) ? x.q : 0; return active().filter(x=>x.next<=t).map((x,i)=>[x,i]).sort((a,b)=>key(a[0])-key(b[0]) || a[1]-b[1]).map(p=>p[0]); }
  function cleanup(){ const t=today(); const n=state.tasks.length; state.tasks=state.tasks.filter(x=>!(x.done && x.done<t)); if(state.tasks.length!==n) save(); }

  /* ---------- streak ---------- */
  function markToday(){
    if(!state.days) state.days = {};
    const td = today(), days = state.days;
    if(state.lastSeen && state.lastSeen < td){
      if(days[state.lastSeen]==="open") days[state.lastSeen]="miss";
      for(let g=addDays(state.lastSeen,1); g<td; g=addDays(g,1)){
        if(!days[g]) days[g] = active().some(x=>x.next<=g) ? "miss" : "empty";
      }
    }
    state.lastSeen = td;
    const due = dueTasks().length;
    if(due>0) days[td]="open";
    else if(days[td]==="open" || state.log.some(e=>e.d===td)) days[td]="done";
    const cut = addDays(td,-400);
    for(const k in days){ if(k<cut) delete days[k]; }
  }
  function streak(){
    const days = state.days||{}, td = today();
    let n = days[td]==="done" ? 1 : 0, d = addDays(td,-1);
    for(let i=0;i<400;i++,d=addDays(d,-1)){
      const st = days[d];
      if(st==="done") n++; else if(st==="empty") continue; else break;
    }
    return n;
  }
  function render(opts){
    try{ updateBackupBadge(); }catch(e){}
    const before = JSON.stringify(state.days||{}) + state.lastSeen;
    markToday();
    const n = streak(); if(n > (state.best||0)) state.best = n;
    if(JSON.stringify(state.days) + state.lastSeen !== before) save();
    render0(opts);
    if(n>0){
      const heat = Math.min(n,20)/20, cnt = Math.min(6, 1+Math.floor(n/4));
      let em = '';
      for(let i=0;i<cnt;i++){
        const j = ((i*7+3)%11)/11, dur = 1.25+j*0.6;
        em += '<i style="left:'+(12+(i+0.5)/cnt*76).toFixed(0)+'%;animation-delay:'+(-(i/cnt)*dur).toFixed(2)+'s;animation-duration:'+dur.toFixed(2)+'s;--dx:'+((j-0.5)*20).toFixed(1)+'px;--s:'+(0.8+j*0.5).toFixed(2)+'"></i>';
      }
      const f = '<span class="sk" role="img" aria-label="Streak '+n+(n===1?' Tag':' Tage')+'" style="--heat:'+heat.toFixed(2)+'"><span class="skn" aria-hidden="true">'+n+'</span><span class="emb" aria-hidden="true">'+em+'</span></span>';
      countEl.innerHTML = countEl.innerHTML ? countEl.innerHTML+' · '+f : f;
    }
  }
  /* streak banner */
  function showStreakBanner(n){
    sfx("streak");
    const ban=document.getElementById("streakban");
    document.getElementById("sbnum").textContent=n;
    document.getElementById("sblbl").textContent=(n===1?"Tag":"Tage")+" in Folge"+(n>1 && n===state.best?" · Rekord":"");
    ban.classList.remove("go"); void ban.offsetWidth; ban.classList.add("go");
    liveEl.textContent = n+(n===1?" Tag":" Tage")+" in Folge";
    clearTimeout(showStreakBanner.t); showStreakBanner.t=setTimeout(()=>{ ban.classList.remove("go"); },5300);
  }
  /* ---------- 3D number on the done screen ---------- */
  let done3dOpen = false;
  const N3D_LAYERS = 26, N3D_STEP = 1.7, N3D_BASE = {x:-9, y:24};
  function build3dNumber(n, em){
    const wrap=document.createElement("div"); wrap.className="n3d";
    wrap.tabIndex=0; wrap.setAttribute("role","button");
    wrap.setAttribute("aria-expanded", done3dOpen ? "true" : "false");
    wrap.setAttribute("aria-label", n+" Aufgaben heute erledigt. Tippen zeigt die Liste.");
    const digits=String(n).length; wrap.style.setProperty("--k", digits>2 ? .68 : 1);
    const flo=document.createElement("div"); flo.className="n3d-float";
    const rot=document.createElement("div"); rot.className="n3d-rot";
    const glow=document.createElement("span"); glow.className="n3d-glow"; glow.textContent=n; glow.setAttribute("aria-hidden","true");
    glow.style.transform="translateZ("+(-(N3D_LAYERS+4)*N3D_STEP)+"px)";
    rot.appendChild(glow);
    for(let i=N3D_LAYERS;i>=0;i--){
      const l=document.createElement("span"); l.className="n3d-l"+(i===0?" f":"")+(i===N3D_LAYERS?" b":"");
      l.textContent=n; l.setAttribute("aria-hidden","true");
      l.style.transform="translateZ("+(-i*N3D_STEP)+"px)";
      rot.appendChild(l);
    }
    flo.appendChild(rot); wrap.appendChild(flo);
    let rx=0, ry=0, sx=0, sy=0, down=false, moved=false, holdT=0, pid=null;
    const apply=(anim)=>{ rot.style.transition = anim ? "transform .9s cubic-bezier(.2,1.4,.4,1)" : "none";
      rot.style.transform="rotateX("+(N3D_BASE.x+rx)+"deg) rotateY("+(N3D_BASE.y+ry)+"deg)"; };
    apply(false);
    const toggle=()=>{ sfx("tap"); done3dOpen=!done3dOpen; em.classList.toggle("open", done3dOpen); wrap.setAttribute("aria-expanded", done3dOpen?"true":"false"); };
    wrap.addEventListener("pointerdown", e=>{
      down=true; moved=false; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
      try{ wrap.setPointerCapture(pid); }catch(_){}
      clearTimeout(holdT); holdT=setTimeout(()=>{ if(down) wrap.classList.add("held"); }, 220);
    });
    wrap.addEventListener("pointermove", e=>{
      if(!down) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(!moved && Math.hypot(dx,dy)>6){ moved=true; wrap.classList.add("held"); }
      if(moved){ ry=Math.max(-50,Math.min(50,dx*0.35)); rx=Math.max(-35,Math.min(35,-dy*0.3)); apply(false); }
    });
    const end=()=>{
      if(!down) return; down=false; clearTimeout(holdT);
      const wasHeld = wrap.classList.contains("held");
      wrap.classList.remove("held");
      if(moved){ rx=0; ry=0; apply(true); }
      else if(!wasHeld) toggle();
    };
    wrap.addEventListener("pointerup", end);
    wrap.addEventListener("pointercancel", ()=>{ down=false; clearTimeout(holdT); wrap.classList.remove("held"); rx=0; ry=0; apply(true); });
    wrap.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    return wrap;
  }
  /* ---------- achievements: 8 objects x 7 parts, one part per completed day ---------- */
  const ACH_PARTS = 7;
  // Seasons: append new seasons here later. Each object has 7 parts, one part per completed day.
  const ACH_SEASONS = [
    { t:"Season 1", sub:"Die Reise beginnt", objs:[
      {n:"Das große Fest", s:"Ein Geburtstag, ein Feuerwerk und ein Gast, der plötzlich verschwindet.", ic:'<path d="M12 2l1.2 2.6 2.8.4-2 2 .5 2.8L12 8.5 9.5 9.8l.5-2.8-2-2 2.8-.4z"/><path d="M12 11l8 5H4z"/><path d="M6 16h2v5H6zM16 16h2v5h-2z"/>'},
      {n:"Der Aufbruch", s:"Ein Ring im Feuer verrät sein Geheimnis. Höchste Zeit zu gehen.", ic:'<path d="M11 3h2v18h-2z"/><path d="M4 5h11l3 2.5-3 2.5H4z"/><path d="M20 12H9l-3 2.5L9 17h11z"/>'},
      {n:"Der alte Wald", s:"Eine knorrige Weide, uralte Gräber und ein fröhlicher Retter.", ic:'<path d="M12 3c-5 0-8 3-8 7 0 2 1 4 2 5l1-4 1 5 2-6v11h4V10l2 6 1-5 1 4c1-1 2-3 2-5 0-4-3-7-8-7z"/>'},

    const add=document.createElement("button"); add.className="btn"; add.textContent="Aufgabe anlegen"; add.onclick=()=>openForm(null);
    foot.append(add); inner.appendChild(foot);
  }
  /* ---------- calendar ---------- */
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const WDL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  let calMonth = null, calSel = null;
  function renderCal(){
    sheetMode = "cal";
    const byDay = {};
    state.log.forEach(e=>{ (byDay[e.d] = byDay[e.d] || []).push(e); });
    const [y,m] = calMonth.split("-").map(Number);
    const first = calMonth+"-01", dim = new Date(y, m, 0).getDate(), lead = wd(first), td = today();
    inner.innerHTML = '';
    const top=document.createElement("div"); top.className="top";
    top.innerHTML='<h1>Verlauf</h1><button class="icon-btn" aria-label="Schließen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>';
    top.querySelector("button").onclick=closeSheet; inner.appendChild(top);
    const wrap=document.createElement("div"); wrap.className="calwrap";
    let monthCount=0; for(let d=1; d<=dim; d++){ const k=calMonth+"-"+pad(d); if(byDay[k]) monthCount+=byDay[k].length; }
    const box=document.createElement("div"); box.className="cal glass";
    const head=document.createElement("div"); head.className="calhead";
    const prev=document.createElement("button"); prev.className="icon-btn"; prev.setAttribute("aria-label","Vorheriger Monat");
    prev.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
    const next=document.createElement("button"); next.className="icon-btn"; next.setAttribute("aria-label","Nächster Monat");
    next.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    const goMonth = delta => { const d=new Date(y, m-1+delta, 1); calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); renderCal(); };
    const title=document.createElement("div"); title.className="caltitle";
    title.innerHTML='<b>'+MONTHS[m-1]+' '+y+'</b><span>'+(monthCount===1?'1 Aufgabe erledigt':monthCount+' Aufgaben erledigt')+'</span>';
    prev.onclick=()=>goMonth(-1);
    next.onclick=()=>goMonth(1);
    let csx=0, csy=0, cdown=false;
    box.addEventListener("pointerdown", e=>{ cdown=true; csx=e.clientX; csy=e.clientY; });
    box.addEventListener("pointerup", e=>{
      if(!cdown) return; cdown=false;
      const dx=e.clientX-csx, dy=e.clientY-csy;
      if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) goMonth(dx<0 ? 1 : -1);
    });
    box.addEventListener("pointercancel", ()=>{ cdown=false; });
    head.append(prev,title,next); box.appendChild(head);
    const grid=document.createElement("div"); grid.className="calgrid";
    DAYS.forEach(d=>{ const h=document.createElement("div"); h.className="calwd"; h.textContent=d; grid.appendChild(h); });
    for(let i=0;i<lead;i++){ grid.appendChild(document.createElement("div")); }
    for(let d=1; d<=dim; d++){
      const k=calMonth+"-"+pad(d), n=(byDay[k]||[]).length, future = k>td;
      const sdays=state.days||{}, isSd=sdays[k]==="done", col=wd(k);
      const cl = isSd && col>0 && d>1 && sdays[calMonth+"-"+pad(d-1)]==="done";
      const cr = isSd && col<6 && d<dim && sdays[calMonth+"-"+pad(d+1)]==="done";
      const b=document.createElement("button"); b.className="calday"+(k===td?" today":"")+(k===calSel?" sel":"")+(n?" has":"")+(isSd?" sd":"")+(cl?" cl":"")+(cr?" cr":"");
      b.disabled = future;
      b.setAttribute("aria-label", d+". "+MONTHS[m-1]+(n?", "+n+" erledigt":""));
      b.innerHTML='<span class="n">'+d+'</span>'+(n?'<span class="dot">'+(n>1?n:'')+'</span>':'<span class="dot empty"></span>');
      b.onclick=()=>{ calSel=k; renderCal(); };
      grid.appendChild(b);
    }
    box.appendChild(grid); wrap.appendChild(box);
    if(calSel && calSel.slice(0,7)===calMonth){
      const sd=parse(calSel), items=byDay[calSel]||[];
      const h=document.createElement("div"); h.className="calsel";
      h.textContent = (calSel===td?"Heute, ":"")+WDL[wd(calSel)]+", "+sd.getDate()+". "+MONTHS[sd.getMonth()];
      wrap.appendChild(h);
      if(items.length){
        const g=document.createElement("div"); g.className="group glass";
        items.forEach(e=>{
          const rw=document.createElement("div"); rw.className="row static";
          const a=document.createElement("span"); a.className="ri"; a.textContent=e.i||"🏠"; a.setAttribute("aria-hidden","true");
          const t=document.createElement("span"); t.className="t"; const tt=document.createElement("span"); tt.className="tt"; tt.textContent=e.t; t.appendChild(tt);
          const c=document.createElement("span"); c.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
          rw.append(a,t,c); g.appendChild(rw);
        });
        wrap.appendChild(g);
      } else {
        const p=document.createElement("div"); p.className="calnone"; p.textContent="An diesem Tag nichts erledigt."; wrap.appendChild(p);
      }
    }
    inner.appendChild(wrap);
  }
  /* ---------- backup ---------- */
  const SETTING_KEYS=["haushalt-skin","haushalt-theme","haushalt-music","haushalt-vol","haushalt-sfx","haushalt-sfxvol"];
  function lastBackup(){ return LS("haushalt-lastbackup",""); }
  function backupAgeDays(){ const lb=lastBackup(); if(!lb) return null; return Math.max(0, Math.round((parse(today())-parse(lb))/864e5)); }
  function backupDue(){ if(!state.tasks.length) return false; const a=backupAgeDays(); return a===null || a>=7; }
  function updateBackupBadge(){ const b=document.getElementById("openPrefs"); if(b) b.classList.toggle("badge", backupDue()); }
  function markBackedUp(){ LSset("haushalt-lastbackup", today()); updateBackupBadge(); }
  function backupPayload(){
    const settings={}; SETTING_KEYS.forEach(k=>{ const v=LS(k,null); if(v!==null) settings[k]=v; });
    return {app:"haushalt", v:2, exportedAt:new Date().toISOString(), state:JSON.parse(JSON.stringify(state)), settings};
  }
  function parseBackup(text){
    let d; try{ d=JSON.parse(String(text).trim()); }catch(e){ return null; }
    const st = d && d.app==="haushalt" && d.state ? d.state : d;   // also accept the old plain format
    if(!st || !Array.isArray(st.tasks) || !st.tasks.every(t=>t && typeof t.id==="string" && typeof t.text==="string" && typeof t.next==="string")) return null;
    return {state:st, settings:(d && d.settings) || null, exportedAt:(d && d.exportedAt) || null};
  }
  function restoreBackup(bk){
    try{ localStorage.setItem("haushalt-prev", JSON.stringify(backupPayload())); }catch(e){}
    state = JSON.parse(JSON.stringify(bk.state));
    if(!Array.isArray(state.log)) state.log=[];
    norm(); cleanup(); save();
    if(bk.settings) Object.keys(bk.settings).forEach(k=>{ if(SETTING_KEYS.includes(k)) LSset(k, bk.settings[k]); });
    applyLook(); musicSetVol(); if(typeof sfxSetVol==="function") sfxSetVol();
    curTrackId=null; if(musicOn()) musicPlay();
    updateBackupBadge();
  }
  async function saveBackupFile(btn, msg){
    const json=JSON.stringify(backupPayload(), null, 1);
    const name="haushalt-sicherung-"+today()+".json";
    let file=null; try{ file=new File([json], name, {type:"application/json"}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"Haushalt Sicherung"}); markBackedUp(); msg("Gesichert. Lege die Datei in iCloud Drive oder „Dateien“ ab."); return; }
      catch(e){ if(e && e.name==="AbortError"){ msg("Abgebrochen, nichts gesichert."); return; } }
    }
    try{
      const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      markBackedUp(); msg("Datei „"+name+"“ wird heruntergeladen.");
    }catch(e){ msg("Speichern als Datei geht hier nicht. Nutze unten „Als Text kopieren“."); }
  }
  function openBackup(){ sheetMode = "backup";
    inner.innerHTML='';
    const top=document.createElement("div"); top.className="top";
    top.innerHTML='<h1>Sicherung</h1><button class="icon-btn" aria-label="Zurück"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>';
    top.querySelector("button").onclick=renderSettings; inner.appendChild(top);
    const f=document.createElement("div"); f.className="form bk";
    const stat=document.createElement("div"); stat.className="bk-stat glass";
    stat.innerHTML='<b></b><span></span>';
    const refreshStat=()=>{
      const age=backupAgeDays(), done=Object.values(state.days||{}).filter(x=>x==="done").length;
      stat.querySelector("b").textContent = age===null ? "Noch nie gesichert" : age===0 ? "Zuletzt gesichert: heute" : age===1 ? "Zuletzt gesichert: gestern" : "Zuletzt gesichert: vor "+age+" Tagen";
      stat.querySelector("span").textContent=state.tasks.length+" Aufgaben · "+(state.log||[]).length+" erledigte Einträge · "+done+" geschaffte Tage. Die Sicherung enthält alles, auch Streak, Erfolge und Einstellungen.";
      stat.classList.toggle("due", backupDue());
    };
    refreshStat(); f.appendChild(stat);
    const msgEl=document.createElement("p"); msgEl.className="bk-msg"; msgEl.setAttribute("aria-live","polite");
    const msg=t=>{ msgEl.textContent=t; refreshStat(); };
    const save1=document.createElement("button"); save1.className="btn full"; save1.textContent="Sicherung speichern";
    save1.dataset.sfx="none"; save1.onclick=()=>{ sfx("save"); saveBackupFile(save1,msg); };
    const hint1=document.createElement("p"); hint1.className="bk-hint"; hint1.textContent="Öffnet das Teilen‑Menü. Wähle „In Dateien sichern“ und dann iCloud Drive. So überlebt die Sicherung auch einen Handywechsel.";
    const load=document.createElement("button"); load.className="btn ghost full"; load.textContent="Sicherung laden";
    const fileIn=document.createElement("input"); fileIn.type="file"; fileIn.accept=".json,application/json,text/plain"; fileIn.id="bkFile"; fileIn.hidden=true;
    load.onclick=()=>fileIn.click();
    const preview=document.createElement("div"); preview.className="bk-prev glass"; preview.hidden=true;
    const showPreview=bk=>{
      preview.hidden=false; preview.innerHTML="";
      const dd=bk.exportedAt ? new Date(bk.exportedAt) : null;
      const pd=Object.values(bk.state.days||{}).filter(x=>x==="done").length;
      const h=document.createElement("b"); h.textContent = dd ? "Sicherung vom "+dd.getDate()+"."+(dd.getMonth()+1)+"."+dd.getFullYear() : "Sicherung gefunden";
      const t=document.createElement("span"); t.textContent=bk.state.tasks.length+" Aufgaben · "+(bk.state.log||[]).length+" erledigte Einträge · "+pd+" geschaffte Tage. Ersetzt deinen aktuellen Stand.";
      const row=document.createElement("div"); row.className="form-actions";
      const no=document.createElement("button"); no.className="btn ghost"; no.textContent="Abbrechen"; no.onclick=()=>{ preview.hidden=true; };
      const yes=document.createElement("button"); yes.className="btn"; yes.textContent="Wiederherstellen"; yes.dataset.sfx="none";
      yes.onclick=()=>{ restoreBackup(bk); sfx("alldone"); preview.hidden=true; msg("Wiederhergestellt. Dein vorheriger Stand ist zur Sicherheit gemerkt."); renderBackupExtras(); render(); };
      row.append(no,yes); preview.append(h,t,row);
    };
    fileIn.onchange=()=>{
      const fl=fileIn.files && fileIn.files[0]; if(!fl) return;
      const rd=new FileReader();
      rd.onload=()=>{ const bk=parseBackup(rd.result); if(!bk){ msg("Diese Datei ist keine Haushalt‑Sicherung."); preview.hidden=true; return; } msg(""); showPreview(bk); };
      rd.onerror=()=>msg("Die Datei konnte nicht gelesen werden.");
      rd.readAsText(fl); fileIn.value="";
    };
    f.append(save1,hint1,load,fileIn,preview,msgEl);
    // emergency: text copy / paste and undo of the last import
    const extras=document.createElement("div"); f.appendChild(extras);
    function renderBackupExtras(){
      extras.innerHTML="";
      let prev=null; try{ prev=JSON.parse(localStorage.getItem("haushalt-prev")||"null"); }catch(e){}
      if(prev && prev.state){
        const ub=document.createElement("button"); ub.className="btn ghost full"; ub.textContent="Stand vor dem letzten Import zurückholen";
        ub.dataset.sfx="none"; ub.onclick=()=>{ const bk=parseBackup(JSON.stringify(prev)); if(!bk) return; try{ localStorage.removeItem("haushalt-prev"); }catch(e){} restoreBackup(bk); try{ localStorage.removeItem("haushalt-prev"); }catch(e){} sfx("undo"); msg("Vorheriger Stand ist zurück."); renderBackupExtras(); render(); };
        extras.appendChild(ub);
      }
      const det=document.createElement("details"); det.className="bk-more";
      det.innerHTML='<summary>Als Text sichern oder einfügen</summary>';
      const box=document.createElement("div"); box.className="bk-text";
      const bx=document.createElement("textarea"); bx.id="bx"; bx.readOnly=true; bx.rows=4; bx.value=JSON.stringify(backupPayload());
      const bc=document.createElement("button"); bc.className="btn ghost full"; bc.textContent="Als Text kopieren";
      bc.onclick=async()=>{ bx.focus(); bx.select(); let ok=false; try{ await navigator.clipboard.writeText(bx.value); ok=true; }catch(e){ try{ ok=document.execCommand("copy"); }catch(_){} }
        if(ok){ markBackedUp(); bc.textContent="Kopiert. In die Notizen einfügen."; } else bc.textContent="Text ist markiert, jetzt manuell kopieren"; };
      const bi=document.createElement("textarea"); bi.id="bi"; bi.rows=4; bi.placeholder="Gesicherten Text hier einfügen";
      const bm=document.createElement("button"); bm.className="btn ghost full"; bm.textContent="Text prüfen";
      bm.onclick=()=>{ const bk=parseBackup(bi.value); if(!bk){ msg("Der Text ist keine Haushalt‑Sicherung."); return; } msg(""); showPreview(bk); preview.scrollIntoView({block:"nearest",behavior:"smooth"}); };
      box.append(bx,bc,bi,bm); det.appendChild(box); extras.appendChild(det);
    }
    renderBackupExtras();
    inner.appendChild(f);
  }
  function openForm(task){ sheetMode = "form";
    const draft = task ? JSON.parse(JSON.stringify(task)) : { text:"", mode:"every", every:1, days:[], date:today() };
    if(!draft.date) draft.date = today();
    inner.innerHTML = '';
    const top = document.createElement("div"); top.className="top";
    top.innerHTML = '<h1>'+(task?'Aufgabe bearbeiten':'Neue Aufgabe')+'</h1>';
    inner.appendChild(top);
    const f = document.createElement("div"); f.className="form";
    f.innerHTML = `
      <div><label class="lbl" for="ft">Was soll auf der Karte stehen?</label>
        <input type="text" id="ft" maxlength="80" placeholder="z. B. Pflanzen gießen"></div>
      <div><label class="lbl" for="fi">Icon</label>
        <div class="icofield"><input type="text" id="fi" maxlength="8" aria-label="Icon"><span>Wird automatisch gewählt. Zum Ändern ein eigenes Emoji eintippen.</span></div></div>
      <div><label class="lbl">Wie oft?</label>
        <div class="seg" role="group"><button type="button" data-m="every">Alle X Tage</button><button type="button" data-m="days">Wochentage</button><button type="button" data-m="once">Einmalig</button></div></div>
      <div id="modeEvery"><div class="every"><span>Alle</span><input type="number" id="fe" min="1" max="365" inputmode="numeric"><span>Tage</span></div></div>
      <div id="modeDays" class="daysbox">
        <select id="frep" aria-label="Wiederholung"></select>
        <div id="posRow" class="posrow"><span>Am</span><select id="fpos" aria-label="Position im Monat"></select><span id="posTail">im Monat</span></div>
        <div><label class="lbl" id="chipLbl">An welchen Tagen?</label><div class="chips" id="chips"></div></div>
      </div>
      <div id="modeOnce"><label class="lbl" for="fd">An welchem Tag?</label><input type="date" id="fd"></div>
      <div class="err" id="ferr"></div>`;
    inner.appendChild(f);
    const ft=f.querySelector("#ft"), fe=f.querySelector("#fe"), err=f.querySelector("#ferr");
    ft.value=draft.text; fe.value=draft.every||1;
    const fi=f.querySelector("#fi"); let iconTouched=false;
    const autoIcon = () => keywordIcon(ft.value) || (task && !task.iconManual && task.text===ft.value.trim() && task.icon) || "🏠";
    fi.value = (task && task.iconManual) ? task.icon : autoIcon();
    ft.addEventListener("input", ()=>{ if(!iconTouched) fi.value = autoIcon(); });
    fi.addEventListener("input", ()=>{ iconTouched = true; }); const fd=f.querySelector("#fd"); fd.value=draft.date;
    const chips=f.querySelector("#chips"), frep=f.querySelector("#frep"), fpos=f.querySelector("#fpos");
    draft.repeat = draft.repeat || "w1"; draft.mpos = draft.mpos || 1;
    REPEATS.forEach(([v,l])=>{ const o=document.createElement("option"); o.value=v; o.textContent=l; frep.appendChild(o); });
    POS.forEach(([v,l])=>{ const o=document.createElement("option"); o.value=v; o.textContent=l; fpos.appendChild(o); });
    frep.value=draft.repeat; fpos.value=String(draft.mpos);
    const chipEls=[];
    const paintChips=()=>chipEls.forEach((c,i)=>c.setAttribute("aria-pressed", draft.days.includes(i)));
    const syncRep=()=>{
      const m = draft.repeat[0]==="m";
      f.querySelector("#posRow").style.display = m?"":"none";
      f.querySelector("#chipLbl").textContent = m ? "Welcher Wochentag?" : "An welchen Tagen?";
      if(m && draft.days.length>1){ draft.days=[draft.days.sort()[0]]; }
      paintChips();
    };
    frep.onchange=()=>{ draft.repeat=frep.value; syncRep(); };
    fpos.onchange=()=>{ draft.mpos=parseInt(fpos.value,10); };
    DAYS.forEach((d,i)=>{ const c=document.createElement("button"); c.type="button"; c.className="chip"; c.textContent=d;
      c.onclick=()=>{ if(draft.repeat[0]==="m"){ draft.days=[i]; } else { const k=draft.days.indexOf(i); k>=0?draft.days.splice(k,1):draft.days.push(i); } paintChips(); };
      chips.appendChild(c); chipEls.push(c); });
    syncRep();
    const segBtns=f.querySelectorAll(".seg button");
    const setMode=m=>{ draft.mode=m; segBtns.forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===m)); f.querySelector("#modeEvery").style.display=m==="every"?"":"none"; f.querySelector("#modeDays").style.display=m==="days"?"":"none"; f.querySelector("#modeOnce").style.display=m==="once"?"":"none"; };
    segBtns.forEach(b=>b.onclick=()=>setMode(b.dataset.m)); setMode(draft.mode);

    const acts=document.createElement("div"); acts.className="form-actions";
    if(task){ const del=document.createElement("button"); del.className="btn danger"; del.textContent="Löschen";
      del.dataset.sfx="none";
      del.onclick=()=>{ if(del.dataset.c){ sfx("del"); state.tasks=state.tasks.filter(x=>x.id!==task.id); save(); renderList(); } else sfx("tap"); if(del.dataset.c) return; else { del.dataset.c="1"; del.textContent="Wirklich löschen?"; } };
      acts.appendChild(del); }
    const cancel=document.createElement("button"); cancel.className="btn ghost"; cancel.textContent="Abbrechen"; cancel.onclick=renderList;
    const ok=document.createElement("button"); ok.className="btn"; ok.textContent="Speichern";
    ok.dataset.sfx="none";
    ok.onclick=()=>{
      const text=ft.value.trim();
      if(!text){ err.textContent="Gib der Aufgabe einen Text."; ft.focus(); return; }
      if(draft.mode==="days" && !draft.days.length){ err.textContent="Wähle mindestens einen Wochentag."; return; }
      if(draft.mode==="once" && !/^\d{4}-\d{2}-\d{2}$/.test(fd.value)){ err.textContent="Wähle ein Datum."; return; }
      const date=fd.value||today();
      const every=Math.min(365,Math.max(1,parseInt(fe.value,10)||1));
      const typed = fi.value.trim();
      const manual = (iconTouched || (task && task.iconManual)) && validIcon(typed) && typed!==autoIcon();
      let needAi = false;
      const setIcon = t => {
        if(manual){ t.icon=typed; t.iconManual=true; return; }
        const textChanged = !task || task.text!==text;
        t.iconManual=false;
        if(textChanged){ t.icon = keywordIcon(text); needAi = !t.icon; }
        else if(!t.icon){ t.icon = keywordIcon(text); needAi = !t.icon; }
      };
      if(task){
        const t=state.tasks.find(x=>x.id===task.id);
        setIcon(t);
        const rhythmChanged = t.mode!==draft.mode || t.every!==every || rep(t)!==draft.repeat || (t.mpos||1)!==draft.mpos || (draft.mode==="once" && t.date!==date) || JSON.stringify([...t.days].sort())!==JSON.stringify([...draft.days].sort());
        t.text=text; t.mode=draft.mode; t.every=every; t.days=[...draft.days]; t.date=date; t.repeat=draft.repeat; t.mpos=draft.mpos;
        if(rhythmChanged) delete t.since;
        if(rhythmChanged && t.mode==="once"){ t.next=date; }
        else if(rhythmChanged && t.mode==="days"){ setAnchor(t); t.next=firstDue(t); }
        else if(rhythmChanged){ t.next = t.last ? (t.mode==="days" ? nextWeekday(t.last,t.days,false) : addDays(t.last,t.every)) : firstDue(t); if(t.next<today() && t.mode==="days") t.next=nextWeekday(today(),t.days,true); }
      } else {
        const t={ id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), text, mode:draft.mode, every, days:[...draft.days], date, repeat:draft.repeat, mpos:draft.mpos, last:null };
        if(t.mode==="days") setAnchor(t);
        t.next=firstDue(t); setIcon(t); state.tasks.push(t);
        if(needAi) aiIcon(t.id);
      }
      if(task && needAi) aiIcon(task.id);
      sfx("save"); save(); renderList();
    };
    acts.append(cancel, ok); inner.appendChild(acts);
    if(!task) setTimeout(()=>ft.focus(),50);
  }

  /* ---------- boot ---------- */
  loadLocal(); norm(); cleanup(); render(); connectDb();
  if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  applyLook();
  let day = today();
  setInterval(()=>{ if(today()!==day){ day=today(); cleanup(); render(); } }, 60000);
})();
</script>
</body>
