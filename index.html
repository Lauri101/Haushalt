<style>
:root{
  --bg:#0A0A0D; --ink:#EDEDF0; --muted:#A1A1AA; --line:rgba(255,255,255,.08);
  --accent:#0A84FF; --done:#30D158; --later:#FF9F0A; --danger:#FF453A;
  --field:rgba(255,255,255,.06); --card:rgba(255,255,255,.07);
  --edge-top:rgba(255,255,255,.16); --edge-bot:rgba(255,255,255,.04);
  --ease:cubic-bezier(.25,1,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  color:var(--ink);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0D}}
:root[data-theme="dark"]{--bg:#0A0A0D}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
/* tablets and laptops: the whole app grows evenly with the screen (phones stay at 1) */
html.scaled body{width:calc(100vw / var(--s));height:calc(100% / var(--s));transform:scale(var(--s));transform-origin:0 0}
button{font:inherit;color:inherit}

/* ambient light: gives the glass something to refract */
.amb{position:fixed;inset:-20%;pointer-events:none;filter:blur(70px);z-index:0}
.amb i{position:absolute;border-radius:50%}
.amb .a{width:60%;height:38%;left:0;top:20%;background:radial-gradient(circle,rgba(var(--amb-a),.42),transparent 70%)}
.amb .b{width:55%;height:40%;right:0;top:46%;background:radial-gradient(circle,rgba(var(--amb-b),.32),transparent 70%)}
.amb .c{width:45%;height:28%;left:22%;bottom:6%;background:radial-gradient(circle,rgba(var(--amb-c),.18),transparent 70%)}

.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--edge-bot);border-top-color:var(--edge-top);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 25px 50px -12px rgba(0,0,0,.6);
}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:32px 16px 0}

  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:dcSpin 3.2s linear infinite}

/* success */
.success{position:fixed;inset:0;z-index:4;pointer-events:none;display:grid;place-items:center}
.success .disc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 35%,rgba(48,209,88,.35),rgba(48,209,88,.12));
  border:1px solid rgba(48,209,88,.45);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 60px rgba(48,209,88,.35);opacity:0;transform:scale(.6)}
.success .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(48,209,88,.6);opacity:0}

.success.go .disc{animation:pop .9s var(--ease) forwards}

@keyframes sbFadeR{0%{transform:none;opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){
  .card.fly,.card.back,.undo,.btn,.row,.chip,.card.behind.promote{transition:none}

  const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };

  function nextWeekday(fromStr, days, inclusive){
    if(!days.length) return addDays(fromStr,1);
    for(let i = inclusive?0:1; i<=7; i++){ const c=addDays(fromStr,i); if(days.includes(wd(c))) return c; }
    return addDays(fromStr,7);
  }
  /* weekly / monthly schedules for "days" mode */
  const REPEATS = [["w1","Every week"],["w2","Every 2 weeks"],["w3","Every 3 weeks"],["m1","Monthly"],["m3","Every 3 months"],["m6","Every 6 months"]];

  const monthIdx = s => { const [y,m]=s.split("-").map(Number); return y*12+m; };
  function posMatch(s, pos){
    const d=parse(s), day=d.getDate();
    if(pos===-1){ const dim=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return day+7>dim; }
    return Math.ceil(day/7)===pos;

    if(isMonthly(t)){

      return "every "+repN(t)+" weeks, "+dn;

  function stickerFor(text){
    const t=" "+String(text||"").toLowerCase().replace(/[^a-zäöüß0-9]+/g," ")+" ";
    for(const [id,keys] of TKEYS){
      for(const k of keys){
        if(k[0]==="=" ? t.includes(" "+k.slice(1)+" ") : t.includes(k)) return "@"+id;
      }
    }
    return null;
  }
  const stickerCache={};

    if(stickerCache[id]) return stickerCache[id];
    const s=TI[id]||TI.home;
    return stickerCache[id]='<svg class="tsticker" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="50" cy="50" r="47" fill="#fff"/><circle cx="50" cy="50" r="41" fill="'+s[0]+'" stroke="#2b1d14" stroke-width="3"/><path d="M22 34A33 33 0 0 1 44 15" stroke="#fff" stroke-width="3" opacity=".35"/>'+s[1].replace(/\$/g,TK)+'</svg>';
  }

  async function aiIcon(id){
    try{
      const sample = await getSample(); if(!sample) return;
      const t0 = state.tasks.find(x=>x.id===id); if(!t0) return;
      const res = await sample.json('Pick the one icon id from this list that best shows the following household task (the task is in German). Answer only with JSON like {"icon":"id"}. Ids: '+Object.keys(TI).join(", ")+'. Task: '+JSON.stringify(t0.text), {modelTier:"quick"});
      const t = state.tasks.find(x=>x.id===id);

    }catch(e){}
  }

  const LOG_DAYS = 1095; // completed entries are kept for 3 years
  function norm(){
    if(!Array.isArray(state.log)) state.log = [];
    if(!state.iconsV2){
      state.tasks.forEach(t=>{ const st=stickerFor(t.text); if(st){ t.icon=st; t.iconManual=false; } else if(!t.iconManual || !t.icon){ t.icon="@home"; t.iconManual=false; } });
      const byId={}; state.tasks.forEach(t=>byId[t.id]=t.icon);
      state.log.forEach(e=>{ e.i = byId[e.id] || stickerFor(e.t) || "@home"; });
      state.iconsV2=1;
    }
    state.tasks.forEach(t=>{ if(!Array.isArray(t.days)) t.days=[]; if(!t.mode) t.mode="every"; if(!t.every) t.every=1; });
    if(!state.days || typeof state.days!=="object") state.days = {};
    if(typeof state.best!=="number") state.best = 0;
    if(!state.logSeeded){
      state.tasks.forEach(t=>{ if(t.last && !state.log.some(e=>e.d===t.last && e.id===t.id)) state.log.push({d:t.last, id:t.id, t:t.text, i:iconOf(t)}); });
      state.log.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
      state.logSeeded = true;
    }
    const cut = addDays(today(), -LOG_DAYS);
    if(state.log.length && state.log[0].d < cut) state.log = state.log.filter(e=>e.d>=cut);
  }

  function badgeStats(){
    const st=state.stats||{}, log=state.log||[], days=state.days||{}, td=today();
    const byDay={}, byTask={}, ids=new Set();
    let early=0, late=0;
    log.forEach(e=>{ byDay[e.d]=(byDay[e.d]||0)+1; byTask[e.id]=(byTask[e.id]||0)+1; ids.add(e.id); if(typeof e.h==="number"){ if(e.h>=5 && e.h<8) early=1; if(e.h>=21 || e.h<3) late=1; } });
    const maxOf=o=>{ let m=0; for(const k in o) if(o[k]>m) m=o[k]; return m; };
    let weekend=0, comeback=0, perfectMonth=0;
    const keys=Object.keys(days).sort();
    keys.forEach(k=>{
      if(days[k]!=="done") return;
      if(parse(k).getDay()===6 && days[addDays(k,1)]==="done") weekend=1;
      let p=addDays(k,-1), g=0; while(days[p]==="empty" && g++<30) p=addDays(p,-1);
      if(days[p]==="miss") comeback=1;
    });
    const months=new Set(keys.map(k=>k.slice(0,7)));
    months.forEach(m=>{
      if(m>=td.slice(0,7)) return;
      const [y,mo]=m.split("-").map(Number), len=new Date(y,mo,0).getDate();
      let ok=true, any=false;
      for(let d=1; d<=len; d++){ const s=days[m+"-"+pad(d)]; if(!s || s==="miss" || s==="open"){ ok=false; break; } if(s==="done") any=true; }
      if(ok && any) perfectMonth=1;
    });
    const now=new Date(), mLen=new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    let monthClean=0;
    for(let d=1; d<=now.getDate(); d++){ const s=days[td.slice(0,8)+pad(d)]; if(s==="miss" || (!s && d<now.getDate())){ monthClean=0; continue; } if(s==="done"||s==="empty") monthClean++; }
    const skins=new Set([...(st.skins||[]), getSkin()]);
    let bk=0; try{ bk=localStorage.getItem("haushalt-lastbackup") ? 1 : 0; }catch(e){}
    return {
      total:Math.max(st.total||0, log.length), created:Math.max(st.created||0, state.tasks.length), distinct:ids.size,
      doneDays:achTotal(), best:Math.max(state.best||0, streak()), maxDay:maxOf(byDay), perTask:maxOf(byTask),
      early:Math.max(early, st.early||0), late:Math.max(late, st.late||0), weekend, comeback, perfectMonth, monthClean, monthLen:mLen,
      rescued:st.rescued||0, rare:st.rare||0, skins:skins.size, backups:Math.max(bk, st.backups||0)

  }

    const settings={}; SETTING_KEYS.forEach(k=>{ const v=LS(k,null); if(v!==null) settings[k]=v; });
    const sync=Sync.exportInfo(), mine=Mine.exportInfo();
    return Object.assign({app:"haushalt", v:2, exportedAt:new Date().toISOString(), state:JSON.parse(JSON.stringify(state)), settings}, sync ? {sync} : {}, mine ? {mine} : {});

  function parseBackup(text){

    const st = d && d.app==="haushalt" && d.state ? d.state : d;   // also accept the old plain format
    if(!st || !Array.isArray(st.tasks) || !st.tasks.every(t=>t && typeof t.id==="string" && typeof t.text==="string" && typeof t.next==="string")) return null;

  }

    MF.forEach((m,i)=>D[m]=MG[i]); WF.forEach((w,i)=>D[w]=WG[i]);
    const pl=(n,one,many)=>(+n===1?one:many);
    const dm=(mon,d)=>d+"."+(M3.indexOf(mon)+1)+".";
    const full=s=>{ const m=/^([A-Z][a-z]{2}) (\d+), (\d{4})$/.exec(s); return m && M3.includes(m[1]) ? m[2]+"."+(M3.indexOf(m[1])+1)+"."+m[3] : null; };
    const tok=x=>{ let m;
      if(WA[x]) return WA[x];
      if(x==="once") return "einmalig"; if(x==="monthly") return "monatlich"; if(x==="daily") return "täglich";
      if((m=/^([A-Z][a-z]{2}) (\d+)$/.exec(x)) && M3.includes(m[1])) return dm(m[1],m[2]);
      if((m=/^every (\d+) (days|weeks|months)$/.exec(x))) return "alle "+m[1]+" "+{days:"Tage",weeks:"Wochen",months:"Monate"}[m[2]];
      if((m=/^(first|second|third|fourth|last) (Mon|Tue|Wed|Thu|Fri|Sat|Sun)$/.exec(x))) return ORD[m[1]]+" "+WA[m[2]];
      return null; };
    const T=s=>{ const r=tr(s); return r==null ? s : r; };
    const RX=[
      [/^last (today|yesterday|(\d+) days ago) · ([A-Z][a-z]{2}) (\d+)$/, m=>"zuletzt "+(m[1]==="today"?"heute":m[1]==="yesterday"?"gestern":"vor "+m[2]+" Tagen")+" · "+dm(m[3],m[4])],
      [/^Shared · (.+)$/, m=>"Geteilt · "+T(m[1])],
      [/^Error: (.+)$/, m=>"Fehler: "+T(m[1])],
      [/^Since ([A-Z][a-z]+) (\d+)\. Nothing is due and your streak is safe\. Shared tasks keep going for the others\.$/, m=>"Seit "+m[2]+". "+MG[MF.indexOf(m[1])]+". Nichts ist fällig und deine Serie ist sicher. Geteilte Aufgaben laufen für die anderen weiter."],
      [/^Connected · (.+)$/, m=>"Verbunden · "+T(m[1])],
      [/^No device code (.+)$/, m=>"Kein Gerätecode "+m[1]],
      [/^No household with the code (.+)$/, m=>"Kein Haushalt mit dem Code "+m[1]],
      [/^Earned (.+)$/, m=>full(m[1]) && "Erreicht am "+full(m[1])],
      [/^Backup from (.+)$/, m=>full(m[1]) && "Sicherung vom "+full(m[1])],
      [/^Streak (\d+) days?$/, m=>"Streak "+m[1]+pl(m[1]," Tag"," Tage")],
      [/^(\d+) days? in a row$/, m=>m[1]+pl(m[1]," Tag"," Tage")+" in Folge"],
      [/^(\d+) tasks? done today\. Tap to show the list\.$/, m=>m[1]+pl(m[1]," Aufgabe"," Aufgaben")+" heute erledigt. Tippen zeigt die Liste."],
      [/^(\d+) shared tasks?$/, m=>m[1]+pl(m[1]," geteilte Aufgabe"," geteilte Aufgaben")],
      [/^(\d+)× done( by you)?( · every ([\d.]+) days on average)?$/, m=>m[1]+"× erledigt"+(m[2]?" von dir":"")+(m[3]?" · im Schnitt alle "+String(m[4]).replace(".",",")+" Tage":"")],
      [/^(\d+) of (\d+) done today$/, m=>m[1]+" von "+m[2]+" heute erledigt"],
      [/^(\d+) tasks? for today$/, m=>m[1]+pl(m[1]," Aufgabe"," Aufgaben")+" für heute"],
      [/^(\d+) tasks? done$/, m=>m[1]+pl(m[1]," Aufgabe"," Aufgaben")+" erledigt"],
      [/^(\d+) tasks?$/, m=>m[1]+pl(m[1]," Aufgabe"," Aufgaben")],
      [/^(\d+) completed entr(y|ies)$/, m=>m[1]+" erledigte Einträge"],
      [/^(\d+) days? done\. (.+)$/, m=>m[1]+" geschaffte Tage. "+T(m[2])],
      [/^Part (\d+) of (\d+)$/, m=>"Teil "+m[1]+" von "+m[2]],
      [/^(.+) is still sealed$/, m=>T(m[1])+" ist noch versiegelt"],
      [/^Finish (.+) first\. (\d+) days? to go\.$/, m=>"Schaffe zuerst "+T(m[1])+". Noch "+m[2]+pl(m[2]," Tag"," Tage")+"."],
      [/^Finish (.+) · (\d+) days? to go$/, m=>"Schaffe "+T(m[1])+" · noch "+m[2]+pl(m[2]," Tag"," Tage")],
      [/^Season (\d+) complete!$/, m=>"Season "+m[1]+" geschafft!"],
      [/^On to Season (\d+)$/, m=>"Weiter zu Season "+m[1]],
      [/^(Very important: )?(.+)\. Swipe right for done, left for again tomorrow, down for later today\.$/, m=>(m[1]?"Sehr wichtig: ":"")+m[2]+". Rechts wischen für erledigt, links für morgen wieder, nach unten für später heute."],
      [/^Open for (\d+) days?$/, m=>pl(m[1],"Seit 1 Tag offen","Seit "+m[1]+" Tagen offen")],
      [/^Music file could not be loaded \((.+)\)$/, m=>"Musikdatei nicht ladbar ("+({"file missing":"Datei fehlt",error:"Fehler",decoding:"Dekodierung"}[m[1]]||m[1])+")"],
      [/^and (\d+) more$/, m=>"und "+m[1]+" weitere"],
      [/^(\d+) of (\d+) unlocked$/, m=>m[1]+" von "+m[2]+" freigeschaltet"],
      [/^(\d+) of (\d+)( days this month)?$/, m=>m[1]+" von "+m[2]+(m[3]?" Tage in diesem Monat":"")],
      [/^(\d+) \(real\)$/, m=>m[1]+" (echt)"],
      [/^Last: (\d+) days ago$/, m=>"Zuletzt vor "+m[1]+" Tagen"],
      [/^Last backup: (\d+) days ago$/, m=>"Zuletzt gesichert: vor "+m[1]+" Tagen"],
      [/^Downloading (.+)\.$/, m=>"Datei „"+m[1]+"“ wird heruntergeladen."],
      [/^(Today, )?(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday), ([A-Z][a-z]+) (\d+)$/, m=>MF.includes(m[3]) && (m[1]?"Heute, ":"")+D[m[2]]+", "+m[4]+". "+D[m[3]]],
      [/^([A-Z][a-z]+) (\d{4})$/, m=>MF.includes(m[1]) && D[m[1]]+" "+m[2]],
      [/^([A-Z][a-z]+) (\d+)(, (\d+) done)?$/, m=>MF.includes(m[1]) && m[2]+". "+D[m[1]]+(m[3]?", "+m[4]+" erledigt":"")],
      [/^(.+), locked, (\d+) of (\d+)$/, m=>T(m[1])+", gesperrt, "+m[2]+" von "+m[3]],
      [/^(.+), (complete|locked|unlocked)$/, m=>T(m[1])+", "+{complete:"vollständig",locked:"gesperrt",unlocked:"freigeschaltet"}[m[2]]],
      [/^(.+), (\d+) of (\d+)$/, m=>T(m[1])+", "+m[2]+" von "+m[3]],
      [/^[A-Za-z0-9 ]+(, [A-Za-z0-9 ]+)+$/, m=>{ const p=m[0].split(", ").map(tok); return p.every(x=>x!=null) ? p.join(", ") : null; }],
      [/^\S.* · .*\S$/, m=>{ const p=m[0].split(" · "); let any=false; const q=p.map(x=>{ const r=tr(x); if(r!=null) any=true; return r==null?x:r; }); return any ? q.join(" · ") : null; }]
    ];
    function tr(s){
      const k=s.trim(); if(!k || !/[A-Za-z]/.test(k)) return null;
      if(Object.prototype.hasOwnProperty.call(D,k)) return D[k];
      const t=tok(k); if(t!=null) return t;
      for(const [re,f] of RX){ const m=re.exec(k); if(m){ const r=f(m); if(r) return r; } }
      return null;
    }
    let lang = "en"; try{ lang = localStorage.getItem("haushalt-lang")==="de" ? "de" : "en"; }catch(e){}
    const ATTR=["aria-label","placeholder","title"];
    const skip=n=>{ const e=n.nodeType===1?n:n.parentElement; return !e || !!e.closest('script,style,[translate="no"]') || (!!e.closest("svg") && !e.closest("text")); };
    function doText(n){
      if(skip(n)) return;
      if(n.__de!==undefined && n.data===n.__de) return;
      const r=tr(n.data); if(r==null) return;
      const lead=n.data.match(/^\s*/)[0], tail=n.data.match(/\s*$/)[0];
      n.__en=n.data; n.__de=lead+r+tail; n.data=n.__de;
    }
    function doAttr(el,a){
      const v=el.getAttribute(a); if(v==null || skip(el)) return;
      const m=el.__i18n||(el.__i18n={});
      if(m[a] && m[a].de===v) return;
      const r=tr(v); if(r==null) return;
      m[a]={en:v,de:r}; el.setAttribute(a,r);
    }
    function walk(root){
      if(root.nodeType===3){ doText(root); return; }
      if(root.nodeType!==1) return;
      ATTR.forEach(a=>doAttr(root,a));
      const w=document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT); let n;
      while((n=w.nextNode())){ if(n.nodeType===3) doText(n); else ATTR.forEach(a=>doAttr(n,a)); }
    }
    function restore(){
      const w=document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT); let n;
      while((n=w.nextNode())){
        if(n.nodeType===3){ if(n.__de!==undefined && n.data===n.__de) n.data=n.__en; delete n.__de; }
        else if(n.__i18n){ for(const a in n.__i18n){ if(n.getAttribute(a)===n.__i18n[a].de) n.setAttribute(a,n.__i18n[a].en); } delete n.__i18n; }
      }
    }
    const obs=new MutationObserver(list=>{
      if(lang!=="de") return;
      for(const r of list){
        if(r.type==="childList") r.addedNodes.forEach(walk);
        else if(r.type==="characterData") doText(r.target);
        else if(r.type==="attributes") doAttr(r.target, r.attributeName);
      }
    });
    function setLang(l){
      lang = l==="de" ? "de" : "en";
      try{ localStorage.setItem("haushalt-lang", lang); }catch(e){}
      try{ Mine.settingsChanged(); }catch(e){}
      document.documentElement.lang = lang;
      if(lang==="de") walk(document.body); else restore();
    }
    function init(){
      document.documentElement.lang = lang;
      obs.observe(document.body, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:ATTR});
      if(lang==="de") walk(document.body);
    }
    return { init, setLang, get lang(){ return lang; }, t:s=>lang==="de" ? T(s) : s, tr };
  })();

  /* ---------- boot ---------- */
  I18N.init(); loadLocal(); norm(); cleanup(); render(); connectDb(); Sync.connect(); Mine.connect();
  if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  applyLook();
  let day = today();
  setInterval(()=>{ if(today()!==day){ day=today(); cleanup(); render(); } }, 60000);
})();
</script>
